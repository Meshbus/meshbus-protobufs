  TELEMETRY_CHANNEL_ID_PM_ZERO_POINT_FIVE_COUNT = 31;
  TELEMETRY_CHANNEL_ID_PM_ONE_COUNT = 32;
  TELEMETRY_CHANNEL_ID_PM_TWO_POINT_FIVE_COUNT = 33;
  TELEMETRY_CHANNEL_ID_PM_FIVE_COUNT = 34;
