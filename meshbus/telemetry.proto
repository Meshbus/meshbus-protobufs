// Global telemetry sampling policy.
message TelemetryConfig {
  // Enables background telemetry sampling and publication.
  bool enabled = 1;

  // Sampling interval in milliseconds for periodic telemetry collection.
  // The minimum accepted interval is defined by the firmware target.
  uint32 sample_interval = 2;
}

// Query telemetry service status and statically configured channels.
message TelemetryStatusRequest {}

// Current sampling policy plus the devicetree-configured channel IDs.
message TelemetryStatusResponse {
  TelemetryConfig config = 1;

  // Provider identities remain firmware-internal. A client reads channels by
  // ID and never selects or persists a provider at runtime.
  repeated TelemetryChannelId channels = 2;
}

// Fetch the current telemetry configuration.
message TelemetryConfigGetRequest {}

// Current effective telemetry configuration.
message TelemetryConfigGetResponse {
  TelemetryConfig config = 1;
}

// Replace the full telemetry configuration.
message TelemetryConfigSetRequest {
  TelemetryConfig config = 1;
}
// Effective telemetry configuration after validation/application.
message TelemetryConfigSetResponse {
  TelemetryConfig config = 1;
}

// Restore telemetry configuration defaults.
message TelemetryConfigResetRequest {}

// Effective telemetry configuration after reset.
message TelemetryConfigResetResponse {
  TelemetryConfig config = 1;
}

// Read the latest values for one Zephyr sensor channel.
message TelemetryReadRequest {
  // ACCEL_X is the protobuf default (zero). Omitting this non-optional field
  // selects ACCEL_X.
  TelemetryChannelId channel_id = 1;
}

// One scalar sensor value represented in Zephyr `struct sensor_value` form.
message TelemetrySensorValue {
  // Whole-number component.
  sint32 integer = 1;

  // Fractional component in micro-units (`val2` in Zephyr sensor_value).
  sint32 fractional_micro = 2;
}

// Result of a synchronous telemetry read.
message TelemetryReadResponse {
  // Echo of the requested logical channel ID.
  TelemetryChannelId channel_id = 1;

  // Number of valid entries in `values`.
  uint32 value_count = 2;

  // Channel values in the same order returned by the driver/service.
  repeated TelemetrySensorValue values = 3;
}

// Trigger an immediate telemetry sample cycle.
message TelemetryTriggerRequest {}

// Result of an immediate sample trigger request.
message TelemetryTriggerResponse {
  bool triggered = 1;
}

// Toggle telemetry enable state without replacing the rest of the config.
message TelemetryEnableRequest {
  bool enabled = 1;
}

// Effective telemetry configuration after applying the enable toggle.
message TelemetryEnableResponse {
  TelemetryConfig config = 1;
}
