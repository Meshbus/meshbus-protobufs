  TELEMETRY_CHANNEL_ID_HUMIDITY = 16;
  TELEMETRY_CHANNEL_ID_AMBIENT_LIGHT = 17;
  TELEMETRY_CHANNEL_ID_LIGHT = 18;
  TELEMETRY_CHANNEL_ID_IR = 19;
  TELEMETRY_CHANNEL_ID_RED = 20;
  TELEMETRY_CHANNEL_ID_GREEN = 21;
  TELEMETRY_CHANNEL_ID_BLUE = 22;
