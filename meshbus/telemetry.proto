syntax = "proto3";

package meshbus;

option csharp_namespace = "Meshbus.Protobufs";
option go_package = "github.com/meshbus/go/generated";
option java_outer_classname = "TelemetryProtos";
option java_package = "org.meshbus.proto";
option swift_prefix = "";

// MCUmgr schema for the local telemetry/sensor service.
//
// This group exposes configuration for periodic sampling and a synchronous read
// API that maps directly to Zephyr sensor channels.
enum TelemetryMgmtGroupId {
  TELEMETRY_MGMT_GROUP_ID_UNSPECIFIED = 0;
  TELEMETRY_MGMT_GROUP_ID_MESHBUS_TELEMETRY = 72;
}

// Command IDs handled by the Meshbus telemetry management group.
enum TelemetryMgmtCommandId {
  TELEMETRY_MGMT_COMMAND_ID_CONFIG = 0;
  TELEMETRY_MGMT_COMMAND_ID_STATUS = 1;
  TELEMETRY_MGMT_COMMAND_ID_READ = 2;
  TELEMETRY_MGMT_COMMAND_ID_TRIGGER = 3;
  TELEMETRY_MGMT_COMMAND_ID_CONFIG_RESET = 4;
  TELEMETRY_MGMT_COMMAND_ID_ENABLE = 5;
}

