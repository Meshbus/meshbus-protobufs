syntax = "proto3";

package meshbus;

option csharp_namespace = "Meshbus.Protobufs";
option go_package = "github.com/meshbus/go/generated";
option java_outer_classname = "MeshcoreProtos";
option java_package = "org.meshbus.proto";
option swift_prefix = "";

// MCUmgr schema for local MeshCore identity, runtime policy, and MeshCore
// protocol requests.
//
// This group owns local MeshCore configuration. Persisted remote contacts live
// in contact.proto.
enum MeshcoreMgmtGroupId {
  MESHCORE_MGMT_GROUP_ID_UNSPECIFIED = 0;
  MESHCORE_MGMT_GROUP_ID_MESHBUS_MESHCORE = 70;
}

// Command IDs handled by the Meshbus MeshCore management group.
enum MeshcoreMgmtCommandId {
  MESHCORE_MGMT_COMMAND_ID_CONFIG = 0;
  MESHCORE_MGMT_COMMAND_ID_CONFIG_RESET = 1;
  MESHCORE_MGMT_COMMAND_ID_ADVERT = 2;
  MESHCORE_MGMT_COMMAND_ID_NODE_DISCOVER = 3;
  MESHCORE_MGMT_COMMAND_ID_TRACE = 4;
  MESHCORE_MGMT_COMMAND_ID_CHANNEL_DATA = 5;
  MESHCORE_MGMT_COMMAND_ID_ANON_DATA = 6;
  MESHCORE_MGMT_COMMAND_ID_RAW_DATA = 7;
  MESHCORE_MGMT_COMMAND_ID_CONTROL_DATA = 8;
  MESHCORE_MGMT_COMMAND_ID_BINARY_RESPONSE = 9;
}

enum MeshcoreRole {
  MESHCORE_ROLE_UNSPECIFIED = 0;
  MESHCORE_ROLE_CHAT = 1;
  MESHCORE_ROLE_REPEATER = 2;
  MESHCORE_ROLE_ROOM = 3;
  MESHCORE_ROLE_SENSOR = 4;
}

// Persistent local MeshCore configuration.
message MeshcoreConfig {
  // Per-category telemetry sharing policy enforced for this MeshCore node.
  enum TelemetryMode {
    // Never include this telemetry category in contact-visible output.
    TELEMETRY_DENY        = 0;

    // Allow sharing only when the contact's flags/permissions allow it.
    TELEMETRY_ALLOW_FLAGS = 1;

    // Always allow this telemetry category to be shared.
    TELEMETRY_ALLOW_ALL   = 2;
  }

  // Loop detection aggressiveness for repeater forwarding logic.
  enum LoopDetect {
    LOOP_DETECT_OFF      = 0;
    LOOP_DETECT_MINIMAL  = 1;
    LOOP_DETECT_MODERATE = 2;
    LOOP_DETECT_STRICT   = 3;
  }

  // Local MeshCore public key (32 bytes).
  bytes public_key = 1;

  // Local MeshCore private key (64 bytes).
  bytes private_key = 2;

  // Human-readable local node name.
  // The Nanopb profile allows at most 31 UTF-8 bytes plus a terminating NUL.
  string name = 3;

  // Local latitude in signed microdegrees (1e-6 degrees).
  sint32 latitude = 4;

  // Local longitude in signed microdegrees (1e-6 degrees).
  sint32 longitude = 5;

  // When true, the node will not forward mesh packets.
  bool disable_fwd = 6;

  // Maximum route/flood path length accepted/generated by the repeater logic.
  uint32 flood_max = 7;

  // Delay multiplier used by the retransmission scheduler for relayed traffic.
  float tx_delay_factor = 8;

  // Delay multiplier used for direct-neighbor retransmission scheduling.
  float direct_tx_delay_factor = 9;

  // Number of acknowledgments required before a multi-ack send is considered
  // satisfied.
  uint32 multi_acks = 10;

  // Periodic advert interval used by repeater/node advert scheduling.
  uint32 advert_interval = 11;

  // Periodic flood advert interval used by repeater advert scheduling.
  uint32 flood_advert_interval = 12;

  // When true, include the configured position in local adverts.
  bool advert_position = 13;

  // Add-contact configuration bitmask.
  // bit0: overwrite oldest non-favorite when the contact table is full
  // bit1: auto-add chat contacts
  // bit2: auto-add repeater contacts
  // bit3: auto-add room contacts
  // bit4: auto-add sensor contacts
  // bit5: manual add mode (1: honor role bits above, 0: allow all roles)
  uint32 add_contact_config = 14;

  // Base/runtime telemetry sharing policy.
  TelemetryMode telemetry_mode_base = 15;

  // Location telemetry sharing policy.
  TelemetryMode telemetry_mode_locat = 16;

  // Environmental telemetry sharing policy.
  TelemetryMode telemetry_mode_environment = 17;

  // Number of bytes used for per-hop path hashes in local route encoding.
  // Valid runtime range is 1..3 bytes.
  uint32 path_hash_size = 18;

  // Loop-detection aggressiveness for repeater forwarding.
  LoopDetect loop_detect = 19;

  // When true, a client-role node is also allowed to repeat traffic.
  bool client_repeat = 20;

  // Maximum hop distance for add-contact behavior.
  // 0 = no limit, 1 = direct neighbor only, N = up to N-1 intermediate hops.
  // Check endpoint support for this setting before use.
  uint32 add_contact_hops_limit = 21;

  // Selected protocol role. Changes are applied before persistence is scheduled.
  MeshcoreRole role = 22;
}

// Fetch the last successfully applied MeshCore settings.
message MeshcoreConfigGetRequest {}

// Successfully applied MeshCore settings.
message MeshcoreConfigGetResponse {
  MeshcoreConfig config = 1;
}

// Restore MeshCore configuration defaults.
message MeshcoreConfigResetRequest {}

// Applied device defaults and a new identity after a successful reset.
message MeshcoreConfigResetResponse {
  MeshcoreConfig config = 1;
}

// Replace the full MeshCore configuration in one operation.
message MeshcoreConfigSetRequest {
  MeshcoreConfig config = 1;
}

// Successfully applied MeshCore settings after a full set.
message MeshcoreConfigSetResponse {
  MeshcoreConfig config = 1;
}

// Request zero-hop node discovery.
//
// This is asynchronous: `accepted` only means the request was queued locally.
// Final discovered-node details arrive through the notify channel.
message MeshcoreNodeDiscoverRequest {
  // Meshbus role filter bitmask. When omitted, all known roles are requested.
  optional uint32 filter = 1;

  // Responder last-modify cutoff timestamp in seconds. 0 accepts all matching
  // responders.
  optional uint32 since = 2;
}

// Local acceptance of a node-discover request.
message MeshcoreNodeDiscoverResponse {
  bool accepted = 1;

  // Generated request correlation tag.
  uint32 tag = 2;
}

// Request MeshCore TRACE over an explicit route path.
//
// This is asynchronous: `accepted` only means the request was queued locally.
// Final trace results are correlated by tag on the MeshCore trace response
// surface; Contact wrappers may republish them as Contact-oriented notify
// events.
message MeshcoreTraceRequest {
  // Number of hash bytes per hop in `path`; valid range is 1..3.
  uint32 path_hash_size = 1;

  // Full explicit route path bytes. Callers own route construction.
  bytes path = 2;
}

// Local acceptance of a trace request.
message MeshcoreTraceResponse {
  bool accepted = 1;

  // Generated request correlation tag.
  uint32 tag = 2;
}

// Trigger a local advert broadcast.
message MeshcoreAdvertRequest {
  // Optional route mode override for the advert request.
  optional bool flood = 1;
}

// Local acceptance of an advert request.
message MeshcoreAdvertResponse {
  bool accepted = 1;

  // Effective flood mode applied by the service.
  bool flood = 2;
}

// Submit channel data to the bounded MeshCore runtime queue.
message MeshcoreChannelDataRequest {
  uint32 channel_index = 1;
  uint32 path_len = 2;
  bytes path = 3;
  uint32 data_type = 4;
  bytes payload = 5;
}

message MeshcoreChannelDataResponse {
  bool accepted = 1;
}

// Submit anonymous data encrypted for a full public key.
message MeshcoreAnonDataRequest {
  bytes public_key = 1;
  bytes payload = 2;
}

message MeshcoreAnonDataResponse {
  bool accepted = 1;
}

// Submit raw routed data.
message MeshcoreRawDataRequest {
  uint32 path_len = 1;
  bytes path = 2;
  bytes payload = 3;
}

message MeshcoreRawDataResponse {
  bool accepted = 1;
}

// Submit control data.
message MeshcoreControlDataRequest {
  bytes payload = 1;
}

message MeshcoreControlDataResponse {
  bool accepted = 1;
}

// Submit a binary response matching an earlier binary request.
message MeshcoreBinaryResponseRequest {
  uint32 route = 1;
  bytes public_key = 2;
  uint32 tag = 3;
  uint32 path_len = 4;
  bytes path = 5;
  bytes payload = 6;
}

message MeshcoreBinaryResponseResponse {
  bool accepted = 1;
}
