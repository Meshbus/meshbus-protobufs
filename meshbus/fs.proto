syntax = "proto3";

package meshbus;

option csharp_namespace = "Meshbus.Protobufs";
option go_package = "github.com/meshbus/go/generated";
option java_outer_classname = "FsProtos";
option java_package = "org.meshbus.proto";
option swift_prefix = "";

// MCUmgr schema for Meshbus filesystem control operations.
//
// Standard Zephyr fs_mgmt remains the data plane for upload/download. This
// group owns bounded directory management, file deletion, and known-volume
// lifecycle operations.
enum FsMgmtGroupId {
  FS_MGMT_GROUP_ID_UNSPECIFIED = 0;
  FS_MGMT_GROUP_ID_MESHBUS_FS = 81;
}

// Command IDs handled by the Meshbus filesystem management group.
enum FsMgmtCommandId {
  FS_MGMT_COMMAND_ID_STATUS = 0;
  FS_MGMT_COMMAND_ID_LIST = 1;
  FS_MGMT_COMMAND_ID_MKDIR = 2;
  FS_MGMT_COMMAND_ID_STAT = 3;
  FS_MGMT_COMMAND_ID_DELETE = 4;
  FS_MGMT_COMMAND_ID_FORMAT = 5;
}

// Filesystem entry type.
enum FsEntryType {
  FS_ENTRY_TYPE_UNSPECIFIED = 0;
  FS_ENTRY_TYPE_FILE = 1;
  FS_ENTRY_TYPE_DIR = 2;
}

// Known volume status.
message FsVolumeStatus {
  string id = 1;
  string mount_point = 2;
  bool mounted = 3;
  bool has_capacity = 4;
  uint64 total_bytes = 5;
  uint64 free_bytes = 6;
}

// One directory entry snapshot.
message FsEntry {
  string path = 1;
  string name = 2;
  FsEntryType type = 3;
  uint64 size = 4;
}

// Query a known volume. Empty volume id means "extra".
message FsStatusRequest {
  optional string volume_id = 1;
}

message FsStatusResponse {
  FsVolumeStatus status = 1;
}

// List a directory with bounded pagination.
message FsListRequest {
  string path = 1;
  optional uint32 offset = 2;
  optional uint32 limit = 3;
}

message FsListResponse {
  string path = 1;
  uint32 total_count = 2;
  uint32 next_offset = 3;
  repeated FsEntry entries = 4;
}

message FsMkdirRequest {
  string path = 1;
}

message FsMkdirResponse {
  bool accepted = 1;
}

message FsStatRequest {
  string path = 1;
}

message FsStatResponse {
  FsEntry entry = 1;
}

message FsDeleteRequest {
  string path = 1;
}

message FsDeleteResponse {
  bool accepted = 1;
}

message FsFormatRequest {
  string volume_id = 1;
  string confirm = 2;
}

message FsFormatResponse {
  FsVolumeStatus status = 1;
}
