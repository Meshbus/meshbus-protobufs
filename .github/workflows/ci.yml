# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reference generation tools
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.73.0'

      - name: Run schema and documentation checks
        run: |
          buf lint
          python scripts/check.py --output "$RUNNER_TEMP/meshbus-check"
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Run Python wire example
        run: |
          mkdir -p "$RUNNER_TEMP/meshbus-python"
          python -m grpc_tools.protoc -I . --python_out="$RUNNER_TEMP/meshbus-python" meshbus/*.proto
          python examples/roundtrip.py --generated "$RUNNER_TEMP/meshbus-python"

      - name: Verify Nanopb generation and options
        run: |
          mkdir -p "$RUNNER_TEMP/meshbus-nanopb"
          python -m grpc_tools.protoc -I . \
            --plugin="protoc-gen-nanopb=$(command -v protoc-gen-nanopb)" \
            --nanopb_opt=-I.,--error-on-unmatched \
            --nanopb_out="$RUNNER_TEMP/meshbus-nanopb" meshbus/*.proto
          python scripts/check_generated.py "$RUNNER_TEMP/meshbus-nanopb"

      - name: Check published compatibility baseline
        env:
          BASELINE: ${{ vars.SCHEMA_COMPATIBILITY_BASELINE }}
        run: |
          if [ -z "$BASELINE" ]; then
            echo 'Compatibility check inactive: no public baseline configured.'
            exit 0
          fi
          # Only accept local tags or immutable commit IDs, never remote inputs.
          if git show-ref --verify --quiet "refs/tags/$BASELINE"; then
            baseline_commit=$(git rev-parse --verify "refs/tags/$BASELINE^{commit}")
          elif [[ "$BASELINE" =~ ^[0-9a-fA-F]{40}$ ]]; then
            baseline_commit=$(git rev-parse --verify "$BASELINE^{commit}")
          else
            echo 'Baseline must be a published local tag or full commit SHA.' >&2
            exit 1
          fi
          buf breaking . --against ".git#ref=$baseline_commit"
